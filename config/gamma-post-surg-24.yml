#chmap: /g/g15/angelico/cryo-asic-analysis/config/channelmap.yml
#reduced_quantities: /g/g15/angelico/cryo-asic-analysis/config/reducedquantities.yml
chmap: ../config/channelmap.yml
reduced_quantities: ../config/reducedquantities.yml


#this is an index for the asic number, which will index the tile position for which that asic is attached.
#eventually we will have a structure where you parse many files, one for each asic, with their own
#configuration dictionary, which are then combined into a single waveform dataframe after loading the files. 
#This would be a prereduction phase. But this asic number is used to give channels from the different asics
#unique identifiers that follows the form (asic)*64 + local_channel_num. 
asic: 0 
#These quantities are often changed based on the files that are being parsed. 
sampling_rate: 1 #MSPS
gain: 6 #encoded gain integer, corresponding to something on order 30 mV/fC (check manual for accurate gains)
pt: 2.4 #us


#analysis and reduction based quantities
baseline: [200, 250] #in microseconds relative to the start of the event window
mv_per_adc: 0.439453 #mV/adc, this should be phased out eventually, as mV is not a totally useful unit 
#these are microseconds of time where there are expected glithces.
#These time periods are ignored during pulse finding algorithms. 
ignore_regions: [[0, 25], [1000, 1025]] 

#threshold related quantities
#in multiples of the standard deviation of baseline. 
#Some sublter algorithms may use different thresholds, some
#of these are for different coarse stages of pulse analysis. 
high_threshold: 5 #very robust against noise, finding significant channels
low_threshold: 4
adjacency: 2 #how many adjacent channels (N on each side) to include relative to a channel with a pulse that passes coarse threshold
peak_detect_smoothing: 1 #us, gaussian smoothing time scale (lowpass) for peak detection only

#in pulse processing, we separate individual pulses
#which may be in the same event buffer on the same channel. this is the width
#of the window that we use to isolate a pulse, and analyze it fully
pulse_window: 30 #microseconds
integ_window: [-3, 3] #microseconds relative to the peak of the pulse
cfd_arrival: 0.5 #fraction of the pulse height where the arrival time of a pulse is calculated
cfd_width: 0.2 #fraction of the pulse height where the width of the pulse is calculated

#clustering parameters
clust_time_sep: 2 #microseconds, the maximum time separation between pulses in a cluster
clust_space_sep: 8 #mm, the maximum space separation between pulses in a cluster

#This is used to identify whether the 0-31/32-63 
#channels have been swapped due to a high speed 
#data line processing error on the part of the ePix.
#It has not been used in a while... 
key_channel: None 

dead_channels: [62] #Any channels you want to selectively ignore from some analyses
